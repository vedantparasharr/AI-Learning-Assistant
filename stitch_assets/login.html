<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - DistillLearn</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-background": "#0d1c2e",
                        "error-container": "#ffdad6",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-container": "#e6eeff",
                        "surface-container-low": "#eff4ff",
                        "secondary": "#006a61",
                        "on-tertiary-fixed-variant": "#46464f",
                        "on-secondary-fixed-variant": "#005049",
                        "on-primary-fixed-variant": "#3e3c8f",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#23242c",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "surface-tint": "#5654a8",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#c7c5d1",
                        "secondary-fixed-dim": "#6bd8cb",
                        "outline": "#777682",
                        "on-secondary-fixed": "#00201d",
                        "on-error": "#ffffff",
                        "secondary-container": "#86f2e4",
                        "secondary-fixed": "#89f5e7",
                        "background": "#f8f9ff",
                        "primary-container": "#312e81",
                        "inverse-surface": "#233144",
                        "on-primary-fixed": "#100563",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#9c9af4",
                        "on-tertiary-container": "#a3a3ad",
                        "inverse-primary": "#c3c0ff",
                        "surface-container-highest": "#d5e3fc",
                        "on-surface-variant": "#474651",
                        "surface-variant": "#d5e3fc",
                        "on-secondary-container": "#006f66",
                        "tertiary-fixed": "#e3e1ed",
                        "primary-fixed": "#e2dfff",
                        "error": "#ba1a1a",
                        "surface-bright": "#f8f9ff",
                        "primary": "#1a146b",
                        "surface": "#f8f9ff",
                        "tertiary-container": "#393942",
                        "surface-dim": "#ccdbf3",
                        "outline-variant": "#c8c5d3",
                        "on-tertiary-fixed": "#1a1b23",
                        "on-surface": "#0d1c2e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xxl": "80px",
                        "xl": "48px",
                        "xs": "4px",
                        "unit": "8px",
                        "margin": "32px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "sm": "8px",
                        "md": "16px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "h1": ["Inter"],
                        "display": ["Inter"],
                        "h3": ["Inter"],
                        "h2": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "h1": ["36px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h3": ["24px", { "lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600" }],
                        "h2": ["30px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-md">
<!-- Main Container -->
<main class="w-full max-w-[440px] mx-auto">
<!-- Logo Header -->
<div class="text-center mb-xl">
<h1 class="font-h1 text-h1 text-primary mb-sm">DistillLearn</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to your account</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_-4px_rgba(26,20,107,0.15)] border border-surface-variant p-xl">
<form action="#" class="space-y-gutter" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute inset-y-0 left-0 pl-sm flex items-center text-outline-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">mail</span>
<input autocomplete="email" class="block w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex items-center justify-between mb-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute inset-y-0 left-0 pl-sm flex items-center text-outline-variant pointer-events-none" style="font-variation-settings: 'FILL' 0;">lock</span>
<input autocomplete="current-password" class="block w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline-variant rounded focus:ring-2 focus:ring-primary focus:border-primary font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember-me">Remember me</label>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center items-center py-md px-lg border border-transparent rounded bg-primary font-label-md text-label-md text-on-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors cursor-pointer" type="submit">
                        Sign In
                        <span class="material-symbols-outlined ml-xs text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<!-- Social Logins (Placeholder for Scholarly aesthetic) -->
</div>
<!-- Registration Link -->
<p class="mt-xl text-center font-body-sm text-body-sm text-on-surface-variant">
            Don't have an account?
            <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors ml-xs" href="#">Sign up</a>
</p>
</main>
</body></html>
